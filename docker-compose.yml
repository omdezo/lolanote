# QomraNote — full local stack: MongoDB, Keycloak (+Postgres), Go API, web.
# `make up` (or `docker compose up -d --build`) brings everything online:
#   web       http://localhost:3000   (demo / demo1234)
#   api       http://localhost:8080
#   keycloak  http://localhost:8081   (admin / admin — dev only)
#   mongo     localhost:27017

services:
  mongo:
    image: mongo:7
    container_name: qomranote-mongo
    # A ONE-NODE REPLICA SET, not a cluster. Standalone mongod has no oplog and
    # no multi-document transactions, so the write path compensates by hand and
    # a backup's recovery point is the last dump. --replSet buys both back at
    # one node; --bind_ip_all because the loopback default would refuse the
    # docker network.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      # LOOPBACK ONLY. This ran as "27017:27017", which publishes on every
      # interface — and the database has no credential at all: no
      # MONGO_INITDB_ROOT_* pair here, and the API connects over a bare
      # mongodb://mongo:27017. Anything that could reach this host on 27017 had
      # full read and write over every board, with nothing to bypass.
      #
      # Binding to 127.0.0.1 removes the reachability without touching the data.
      # It is half the fix: the port is closed, the database is still open to
      # anything already on this machine. Turning on real auth means creating a
      # root user INSIDE the existing volume — MONGO_INITDB_ROOT_* only fires on
      # an empty data directory, so adding it here would silently do nothing —
      # and that is a deliberate operational step, not a config edit.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Self-initiating: rs.status() throws on a member that has never been
      # configured, and the catch arm configures it. So the set comes up with
      # the stack and no sidecar, and the check stays a plain liveness probe on
      # every run after the first. The member host MUST be the compose service
      # name — a set that names itself "localhost" is reachable only from
      # inside this container.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:16-alpine
    container_name: qomranote-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: qomranote-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      # Keycloak sits behind the web container's nginx, reached at
      # PUBLIC_ORIGIN/realms/... It must trust the forwarded headers, or it
      # will hand the browser redirect URLs pointing at its own container.
      KC_HOSTNAME: ${PUBLIC_ORIGIN:-http://localhost:3000}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The KC image ships no curl; poke the management health port over TCP.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: ./backend
    container_name: qomranote-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # replicaSet= is what makes the driver discover a primary and open
      # sessions; without it a client of a replica set still cannot start a
      # transaction.
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: ${MONGO_DB:-qomranote}
      MONGO_REPLICA_SET: rs0
      # Split horizon: tokens carry the browser-facing issuer; discovery goes
      # over the docker network.
      # PUBLIC_ORIGIN is the single address the browser uses — a LAN IP, a
      # tunnel hostname, or a real domain. Everything origin-dependent derives
      # from it, so there is one thing to change and no way to set half of it.
      # The token's issuer must equal what the browser saw, or every request is
      # rejected with a mismatch that looks like a login bug.
      KEYCLOAK_ISSUER: ${PUBLIC_ORIGIN:-http://localhost:3000}/realms/qomranote
      KEYCLOAK_INTERNAL_BASE: http://keycloak:8080
      KEYCLOAK_REALM: qomranote
      KEYCLOAK_ADMIN_CLIENT_ID: qomranote-api
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-qomranote-api-secret-change-me}
      KEYCLOAK_WEB_CLIENT_ID: qomranote-web
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /app/data/uploads
      PUBLIC_API_BASE: ${PUBLIC_ORIGIN:-http://localhost:3000}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-qomranote}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:3000},http://localhost:5173,http://localhost:3000
      # ---- AI agent (opt-in) ----
      # With no provider key the harness is nil: /api/v1/agent/* reports the
      # feature unavailable and every entry point stays hidden. Nothing else
      # about the stack changes, so the default stack runs without one.
      AGENT_PROVIDER: ${AGENT_PROVIDER:-anthropic}
      AGENT_MODEL: ${AGENT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_DAILY_CAP_USD: ${AGENT_DAILY_CAP_USD:-2.00}
      # Leave blank unless the model is missing from the built-in price table
      # or you are billed a negotiated rate. Setting these overrides it.
      AGENT_PRICE_INPUT_PER_1M: ${AGENT_PRICE_INPUT_PER_1M:-}
      AGENT_PRICE_OUTPUT_PER_1M: ${AGENT_PRICE_OUTPUT_PER_1M:-}
    ports:
      - "8080:8080"
    volumes:
      - api-uploads:/app/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        # Blank on purpose: the client falls back to its own origin, which is
        # whatever address the page was opened from.
        VITE_KEYCLOAK_URL: ""
        VITE_KEYCLOAK_REALM: qomranote
        VITE_KEYCLOAK_CLIENT_ID: qomranote-web
    container_name: qomranote-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  keycloak-db-data:
  api-uploads:
