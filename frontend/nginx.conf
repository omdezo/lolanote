# SPA + same-origin reverse proxy: the browser talks only to this server;
# /api and /ws forward to the Go API container.
#
# Caching contract: hashed bundles under /assets are immutable (cache for a
# year), while index.html is always revalidated — a deploy is picked up on
# the next load with no hard-refresh. Security headers are repeated per
# location because nginx's add_header does not cascade into blocks that set
# their own.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 128m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Keycloak on the SAME origin. Without this the app needs three reachable
    # hosts, and a bundle built for localhost breaks the moment it is opened
    # from a phone, a tunnel, or a real domain. One origin also means the
    # issuer in the token always matches the address the user typed.
    #
    # /realms   — OIDC endpoints and the login pages
    # /resources — the login theme's CSS, fonts and scripts
    # X-Forwarded-* is what lets Keycloak generate absolute URLs on the public
    # origin rather than on its own container address (KC_PROXY_HEADERS).
    location ~ ^/(realms|resources)/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
    }

    # Hashed build artifacts: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # App shell: always revalidate so deploys land immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
